<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <p data-testid="loader" class="loader" role="status">Loading incidents…</p>
      <ul data-testid="incident-list" class="list"></ul>
    </main>
    <aside data-testid="incident-panel" class="panel" hidden aria-live="polite">
      <div class="p-head"><strong class="p-id"></strong> <span class="p-sev"></span><button type="button" class="p-close" aria-label="Close panel">×</button></div>
      <p class="p-what"></p>
      <p>Opened <time class="p-time"></time></p>
      <button type="button" data-testid="panel-ack" class="p-ack">Ack</button>
      <p class="p-state"></p>
    </aside>
    <footer>sched-prod incident board · build <span data-testid="build-sha">__BUILD_SHA__</span></footer>
  </body>
</html>
